# ==================== Basic Hardware & System ====================
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1

CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=2200
CONFIG_BT_CTLR_RX_BUFFERS=4

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512
CONFIG_SETTINGS_SHELL=y

CONFIG_EXCEPTION_DEBUG=y

CONFIG_BT_SHELL=y
CONFIG_USBD_SHELL=y

# for nRF52840 dongle
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Persistent storage settings for Bluetooth pairing keys
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Zephyr 4.x USB-next Core
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_HID_IN_BUF_COUNT=6

CONFIG_INPUT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Bluetooth Core Config
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CoKVM-Dongle"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1

CONFIG_BT_SETTINGS=y

# Bluetooth Security Manager Protocol (SMP) for pairing encryption
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_PRIVACY=n

# CoKVM Passkey Pairing (more secure than Just Works)
# Automatically enables BT_SMP_ENFORCE_MITM via Kconfig select
CONFIG_COKVM_PASSKEY_PAIRING=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# GATT service
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Device Information Service (DIS) - required for macOS BLE HID compliance
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0x5211
CONFIG_BT_DIS_PNP_VER=0x0100
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.0.0"

# Battery Service (BAS) - required for macOS BLE HID compliance
CONFIG_BT_BAS=y

# Low Latency Connection Parameters
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500
